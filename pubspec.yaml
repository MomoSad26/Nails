name: manigest
description: Aplicación offline-first para gestionar un negocio de uñas.
# If you rename this package, also update imports under lib/.
publish_to: 'none'
version: 1.3.2+5

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.5
  path: ^1.9.1
  intl: ^0.20.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/nailstudio_icon.jpg"
  adaptive_icon_background: "#42075B"
  adaptive_icon_foreground: "assets/icon/nailstudio_icon.jpg"
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true
