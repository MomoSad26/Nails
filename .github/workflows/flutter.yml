name: Compilar APK Android

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manigest-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Analizar, probar y compilar APK firmado
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Instalar Flutter estable
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true

      - name: Generar la carpeta Android
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name=manigest --no-pub .
          fi

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar Dart
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Ejecutar pruebas
        run: flutter test

      - name: Configurar firma de Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
          mkdir -p android/app

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] &&
             [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] &&
             [ -n "${ANDROID_KEY_ALIAS:-}" ] &&
             [ -n "${ANDROID_KEY_PASSWORD:-}" ] &&
             printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE" 2>/dev/null &&
             keytool -list -keystore "$KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2>&1; then
            STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            echo "Se usará la clave de firma configurada en GitHub Actions Secrets."
          else
            rm -f "$KEYSTORE_FILE"
            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS="manigest"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype JKS \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=ManiGest, OU=Mobile, O=ManiGest, L=Miami, ST=Florida, C=US" \
              -noprompt
            echo "::warning::Se usó una firma temporal porque no hay una clave válida en Secrets. Para instalar futuras actualizaciones sin desinstalar, configura los cuatro Secrets de firma."
          fi

          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Conectar la clave al build de release
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          if "import java.util.Properties" not in text:
              text = "import java.util.Properties\n" + text
          text = text.replace("java.util.Properties()", "Properties()")

          properties = '''val manigestSigningProperties = Properties()
          val manigestSigningFile = rootProject.file("key.properties")
          if (manigestSigningFile.exists()) {
              manigestSigningFile.inputStream().use { stream ->
                  manigestSigningProperties.load(stream)
              }
          }

          '''
          if "manigestSigningProperties" not in text:
              if "android {\n" not in text:
                  raise SystemExit("No se encontró android {} en build.gradle.kts")
              text = text.replace("android {\n", properties + "android {\n", 1)

          signing_config = '''    signingConfigs {
                  create("release") {
                      keyAlias = manigestSigningProperties["keyAlias"] as String
                      keyPassword = manigestSigningProperties["keyPassword"] as String
                      storeFile = rootProject.file(manigestSigningProperties["storeFile"] as String)
                      storePassword = manigestSigningProperties["storePassword"] as String
                  }
              }

          '''
          if 'create("release")' not in text:
              text = text.replace("android {\n", "android {\n" + signing_config, 1)

          release_config = '''getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }'''

          build_types_start = text.find("buildTypes {")
          if build_types_start >= 0:
              open_brace = text.find("{", build_types_start)
              depth = 0
              close_brace = -1
              for index in range(open_brace, len(text)):
                  if text[index] == "{":
                      depth += 1
                  elif text[index] == "}":
                      depth -= 1
                      if depth == 0:
                          close_brace = index
                          break
              if close_brace < 0:
                  raise SystemExit("No se pudo analizar buildTypes {}")
              text = text[:close_brace] + "\n        " + release_config + "\n    " + text[close_brace:]
          else:
              raise SystemExit("No se encontró el bloque buildTypes {}")

          path.write_text(text, encoding="utf-8")
          PY

      - name: Compilar un único APK firmado
        run: flutter build apk --release --build-name "1.3.0" --build-number "${GITHUB_RUN_NUMBER}"

      - name: Verificar el certificado de firma
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -E 'SHA-256|DN'

      - name: Publicar el APK como artefacto de Actions
        uses: actions/upload-artifact@v6
        with:
          name: ManiGest-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK en Releases con enlace fijo
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.3.0-${GITHUB_RUN_NUMBER}"
          VERSION="1.3.0 (build ${GITHUB_RUN_NUMBER})"
          cp build/app/outputs/flutter-apk/app-release.apk ManiGest.apk

          NOTES="APK firmada de ManiGest. Descarga directa: https://github.com/MomoSad26/Nails/releases/latest/download/ManiGest.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ManiGest.apk --clobber
            gh release edit "$TAG" --title "ManiGest $VERSION" --notes "$NOTES" --latest
          else
            gh release create "$TAG" ManiGest.apk \
              --target "$GITHUB_SHA" \
              --title "ManiGest $VERSION" \
              --notes "$NOTES" \
              --latest
          fi
